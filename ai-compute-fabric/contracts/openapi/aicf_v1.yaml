openapi: 3.0.3
info:
  title: AI Compute Fabric site-gateway admin API
  version: "1"
  description: |
    Describes what apps/site-gateway serves today (HTTP side). It is checked against a running gateway by
    tests/integration/test_openapi_conformance.py: every path below must exist and answer with a body that validates against
    its schema, and every /api/ route the Go code registers must appear here. The OpenAI-compatible /v1/* inference proxy
    and /metrics are not described (they follow the OpenAI API / Prometheus formats).
    Roles (apps/site-gateway/rbac.go): viewer = GET; operator = GET + pause/resume (optionally limited to one site);
    admin = everything. With no roles file and no admin token the API is open (loopback only).
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
paths:
  /api/whoami:
    get:
      summary: Role of the caller and what the UI may offer
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Whoami"}}}}
  /api/stats:
    get:
      summary: Fleet-wide counters, pooled VRAM and router state
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Stats"}}}}
  /api/cluster/topology:
    get:
      summary: Current cluster topology mode (split, smart_1gpu, merged) and node status
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/ClusterTopology"}}}}
    post:
      summary: (Re)configure the listed workers as split, smart_1gpu or one merged group (admin)
      description: >
        Only primary_worker_id and rpc_worker_ids are touched, so several merged groups can coexist with standalone
        workers. A request that touches a member of an existing merged group must list the whole group.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TopologySwitchRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/ClusterTopology"}}}}
        "400": {description: bad JSON, invalid request, or a merged group touched only partly}
        "403": {description: role not allowed}
        "409": {description: a listed worker is already being switched}
  /api/workers:
    get:
      summary: Page of workers
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        "200":
          description: ok
          headers: {X-Total-Count: {schema: {type: integer}, description: workers matching the filter before paging}}
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Worker"}}}}
  /api/workers/{id}:
    get:
      summary: One worker
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Worker"}}}}
        "404": {description: unknown worker}
  /api/workers/{id}/pause:
    post:
      summary: Ask the worker to stop taking work and release the GPU (operator, admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: accepted}
        "403": {description: role not allowed, or worker outside the operator's site}
        "404": {description: unknown worker}
  /api/workers/{id}/resume:
    post:
      summary: Let a paused worker start again (operator, admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: accepted}
        "403": {description: role not allowed, or worker outside the operator's site}
        "404": {description: unknown worker}
  /api/fleet/stream:
    get:
      summary: Server-sent events, one frame per second with a compact cell per worker
      responses:
        "200": {description: "text/event-stream; each event is `data: <FleetFrame JSON>`", content: {text/event-stream: {schema: {type: string}}}}
  /api/models/catalog:
    get:
      summary: Curated model catalogue with the architecture facts the VRAM estimator uses
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CatalogModel"}}}}}
  /api/vram/estimate:
    get:
      summary: VRAM estimate for a catalogue model (query parameters)
      parameters:
        - {name: model_id, in: query, schema: {type: string}}
        - {name: ctx_per_slot, in: query, schema: {type: integer, minimum: 1}}
        - {name: parallel, in: query, schema: {type: integer, minimum: 1}}
        - {name: flash_attn, in: query, schema: {type: boolean}}
        - {name: kv_bytes_per_elem, in: query, schema: {type: integer, enum: [1, 2]}}
        - {name: gpu_total_mib, in: query, schema: {type: integer, minimum: 1}}
        - {name: os_user_mib, in: query, schema: {type: integer, minimum: 0}}
        - {name: headroom_mib, in: query, schema: {type: integer, minimum: 1}}
        - {name: gpu_count, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Estimate"}}}}
    post:
      summary: Same estimate with a JSON body
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Estimate"}}}}
        "400": {description: bad JSON}
  /api/v1/models/estimate-vram:
    post:
      summary: VRAM estimate for a GGUF file read by the Python sidecar (501 unless the gateway runs with --vram-sidecar-url)
      description: |
        Same body as POST /api/vram/estimate plus `gguf`, a file name under the sidecar's models root. Layer count, KV heads,
        head dimension and weight bytes come from the file header. Confidence is always ESTIMATED: only Qwen3-4B/8B
        (Q4_K_M, Q8_0, F16) on one RTX 3060 were measured (benchmarks/reports/p1_sidecar_estimate_vs_measured.json).
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [gguf], properties: {gguf: {type: string}, ctx_per_slot: {type: integer}, parallel: {type: integer}, flash_attn: {type: boolean}, kv_bytes_per_elem: {type: integer}, gpu_total_mib: {type: integer}, os_user_mib: {type: integer}, headroom_mib: {type: integer}, gpu_count: {type: integer}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Estimate"}}}}
        "400": {description: bad JSON or no gguf name}
        "403": {description: file outside the models root}
        "404": {description: no such model file}
        "422": {description: not a usable GGUF}
        "501": {description: no sidecar configured}
        "502": {description: sidecar unreachable or returned unusable facts}
  /api/tenants:
    get:
      summary: Tenants (API keys are never returned)
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Tenant"}}}}}
    post:
      summary: Create a tenant; the API key is shown once (admin)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, weight: {type: number}, max_inflight: {type: integer}}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/TenantCreated"}}}}
        "409": {description: name already used}
  /api/tenants/{id}:
    patch:
      summary: Change weight, concurrency limit or disabled flag (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {weight: {type: number}, max_inflight: {type: integer}, disabled: {type: boolean}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
        "404": {description: unknown tenant}
    delete:
      summary: Delete a tenant for good; its API key stops working at once (admin). Studio data is kept until removed there.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: deleted}
        "404": {description: unknown tenant}
  /api/tenants/{id}/rotate-key:
    post:
      summary: Issue a new API key; the old one stops working at once (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [api_key], properties: {api_key: {type: string}, note: {type: string}}}}}}
        "404": {description: unknown tenant}
  /api/agents/workflows:
    get:
      summary: Workflows known to the orchestrator (read-only view, proxied to agents/dag_api.py via --agents-url; absent when not configured)
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WorkflowSummary"}}}}}
  /api/agents/workflows/{wf}:
    get:
      summary: Status of every step of one workflow (never inputs or outputs)
      parameters: [{name: wf, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok}
        "404": {description: unknown workflow}
  /api/agents/metrics:
    get:
      summary: Prometheus text metrics for NATS JetStream task bus queue depth, live agents in AICF_AGENTS KV, median wait, and redeliveries
      responses:
        "200": {description: Prometheus text exposition}
  /api/agents/supervisor/recommendations:
    get:
      summary: Propose-only scaling recommendations from ElasticSupervisor (D-FAB-4, requires human approval)
      responses:
        "200": {description: ok}
  /api/agents/bus/overview:
    get:
      summary: Live snapshot of AICF_AGENTS KV profiles, per-TaskType queues, and supervisor recommendations for the dashboard
      responses:
        "200": {description: ok}
  /api/agents/bus/demo:
    get:
      summary: Interactive Elastic Agent Fabric demo actions (spawn, drain, kill, burst, workflow, reset)
      responses:
        "200": {description: ok}
  /api/studio/v1/methods:
    get:
      summary: Customisation methods the Studio offers; the UI builds its tabs from this (viewer)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/StudioMethods"}}}}
  /api/studio/v1/health:
    get:
      summary: Studio service health and what is configured (viewer)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/StudioHealth"}}}}
  /api/studio/v1/lora/base-models:
    get:
      summary: Base models available for LoRA on this machine (viewer)
      responses:
        "200": {description: ok}
  /api/studio/v1/serving:
    get:
      summary: Which model and LoRA adapter the worker serves, and which GGUF files it can switch to (viewer; 503 when --worker-url is not set or the worker is unreachable)
      responses:
        "200": {description: ok}
        "503": {description: not configured or worker unreachable}
    post:
      summary: Serve another model, optionally with an adapter (admin). Either adapter_file (already in the adapters directory) or tenant+job (a succeeded LoRA job, exported to GGUF and attached). The worker restarts the engine once the GPU is free.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [model], properties: {model: {type: string}, adapter_file: {type: string}, tenant: {type: string}, job: {type: string}}}}}}
      responses:
        "200": {description: accepted by the worker}
        "400": {description: invalid input or refused by the worker}
        "403": {description: not an admin}
        "409": {description: the adapter was trained on a different base model, or the job has no adapter}
        "503": {description: not configured, GGUF export unavailable, or worker unreachable}
  /api/studio/v1/full-ft/estimate:
    get:
      summary: Full fine-tune memory ESTIMATE per base model; the method itself is unsupported (viewer)
      responses:
        "200": {description: ok}
  /api/studio/v1/tenants/{tenant}:
    get:
      summary: What the tenant has stored in the Studio (documents, prompt templates, jobs) (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: ok}
    delete:
      summary: Erase every document, prompt template, job and adapter of the tenant (admin; 409 while a job is queued or running)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: deleted, with counts of what was removed}
        "409": {description: jobs still active}
  /api/studio/v1/tenants/{tenant}/rag/documents:
    get:
      summary: Documents in the tenant knowledge base (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: ok}
    post:
      summary: Upload a .txt/.md/.html/.pdf/.docx document, or replace one of the same name (operator)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, text: {type: string}, content_base64: {type: string}, data_class: {type: string, enum: [PUBLIC, INTERNAL, RESTRICTED]}}}}}}
      responses:
        "201": {description: ingested}
        "400": {description: invalid input, content: {application/json: {schema: {$ref: "#/components/schemas/StudioError"}}}}
        "429": {description: quota exceeded}
  /api/studio/v1/tenants/{tenant}/rag/documents/{doc}:
    get:
      summary: Chunks of one document (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: doc, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok}
        "404": {description: unknown document}
    delete:
      summary: Remove a document and its chunks (admin)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: doc, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: deleted}
        "404": {description: unknown document}
  /api/studio/v1/tenants/{tenant}/rag/search:
    post:
      summary: Retrieve the passages most relevant to a query (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [query], properties: {query: {type: string}, top_k: {type: integer, minimum: 1, maximum: 20}}}}}}
      responses:
        "200": {description: ok}
  /api/studio/v1/tenants/{tenant}/rag/ask:
    post:
      summary: Answer from the tenant documents with numbered sources and warnings when the answer is not grounded (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [query], properties: {query: {type: string}, top_k: {type: integer}, prompt_name: {type: string}, prompt_version: {type: integer}, max_tokens: {type: integer}}}}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/RagAnswer"}}}}
        "503": {description: language model unavailable}
  /api/studio/v1/tenants/{tenant}/prompts:
    get:
      summary: Prompt templates of the tenant (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: ok}
    post:
      summary: Save a NEW immutable version of a template (operator)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, system], properties: {name: {type: string}, system: {type: string}, examples: {type: array, items: {type: object}}, note: {type: string}}}}}}
      responses:
        "201": {description: saved}
        "400": {description: invalid input, content: {application/json: {schema: {$ref: "#/components/schemas/StudioError"}}}}
        "429": {description: quota exceeded}
  /api/studio/v1/tenants/{tenant}/prompts/test:
    post:
      summary: Run one question through a template (saved or ad hoc), with or without its examples (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [question]}}}}
      responses:
        "200": {description: ok}
  /api/studio/v1/tenants/{tenant}/prompts/compare:
    post:
      summary: Same questions with and without the few-shot examples, scored by substring / JSON validity (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [questions]}}}}
      responses:
        "200": {description: ok}
  /api/studio/v1/tenants/{tenant}/prompt-default:
    get:
      summary: The template used when a request names none (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: ok}
    put:
      summary: Choose the default template version (operator)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, version]}}}}
      responses:
        "200": {description: ok}
        "404": {description: unknown template or version}
  /api/studio/v1/tenants/{tenant}/prompts/{name}:
    get:
      summary: All versions of a template (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok}
        "404": {description: unknown template}
    delete:
      summary: Delete every version of a template (admin)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: deleted}
        "404": {description: unknown template}
  /api/studio/v1/tenants/{tenant}/prompts/{name}/{version}:
    get:
      summary: One version of a template (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: name, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: ok}
        "404": {description: unknown version}
  /api/studio/v1/tenants/{tenant}/lora/datasets/preview:
    post:
      summary: Validate a Q&A dataset (JSONL or CSV) without training; reports bad rows by line (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [content]}}}}
      responses:
        "200": {description: ok}
        "400": {description: invalid input, content: {application/json: {schema: {$ref: "#/components/schemas/StudioError"}}}}
  /api/studio/v1/tenants/{tenant}/lora/jobs:
    get:
      summary: LoRA jobs of the tenant, newest first, with the runner state (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      responses:
        "200": {description: ok}
    post:
      summary: Queue a LoRA job; refused when the estimated memory does not fit the GPU budget (operator)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [base_model, content]}}}}
      responses:
        "202": {description: queued, content: {application/json: {schema: {$ref: "#/components/schemas/StudioJob"}}}}
        "400": {description: invalid input, content: {application/json: {schema: {$ref: "#/components/schemas/StudioError"}}}}
        "429": {description: too many unfinished jobs}
  /api/studio/v1/tenants/{tenant}/lora/jobs/{job}:
    get:
      summary: One job with its progress (loss curve) and result (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: job, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/StudioJob"}}}}
        "404": {description: unknown job}
    delete:
      summary: Delete a finished job and its adapter (admin)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: job, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: deleted}
        "409": {description: job not finished}
  /api/studio/v1/tenants/{tenant}/lora/jobs/{job}/cancel:
    post:
      summary: Cancel a queued or running job (operator)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: job, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/StudioJob"}}}}
        "409": {description: already finished}
  /api/studio/v1/tenants/{tenant}/lora/jobs/{job}/log:
    get:
      summary: Tail of the worker log (viewer)
      parameters: [{name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: job, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok}
  /api/studio/v1/tenants/{tenant}/lora/jobs/{job}/adapter:
    get:
      summary: The trained adapter as a zip of safetensors files plus a sha256 manifest; with format=gguf a GGUF file for llama-server --lora (viewer; 503 when GGUF export is not configured)
      parameters: [{name: format, in: query, required: false, schema: {type: string, enum: [safetensors, gguf]}}, {name: tenant, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}}, {name: job, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: zip (safetensors) or octet-stream (gguf), content: {application/zip: {schema: {type: string, format: binary}}, application/octet-stream: {schema: {type: string, format: binary}}}}
        "503": {description: GGUF export not configured or conversion failed}
        "409": {description: the job has no adapter}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    Whoami:
      type: object
      required: [role, name, open, can]
      properties:
        role: {type: string, enum: [viewer, operator, admin]}
        name: {type: string}
        open: {type: boolean}
        site: {type: string}
        can:
          type: object
          required: [view, pause, tenants]
          properties: {view: {type: boolean}, pause: {type: boolean}, tenants: {type: boolean}, studio: {type: boolean}, studio_delete: {type: boolean}}
    Buckets:
      type: object
      required: [Total, OSUser, Weights, KVState, Compute, Headroom, Allocatable]
      properties:
        Total: {type: integer, minimum: 0}
        OSUser: {type: integer, minimum: 0}
        Weights: {type: integer, minimum: 0}
        KVState: {type: integer, minimum: 0}
        Compute: {type: integer, minimum: 0}
        Headroom: {type: integer, minimum: 0}
        Allocatable: {type: integer, minimum: 0}
    Worker:
      type: object
      required: [worker_id, state, online, vram_total_bytes, vram_free_bytes, buckets, last_seen]
      properties:
        worker_id: {type: string}
        site_id: {type: string}
        hostname: {type: string}
        gpu_name: {type: string}
        model: {type: string}
        state: {type: string}
        online: {type: boolean}
        vram_total_bytes: {type: integer, minimum: 0}
        vram_free_bytes: {type: integer, minimum: 0}
        buckets: {$ref: "#/components/schemas/Buckets"}
        gpu_temp_c: {type: number}
        user_is_active: {type: boolean}
        pause_requested: {type: boolean}
        lora: {type: string, description: "LoRA adapter file the engine is configured with (empty = none)"}
        switching: {type: boolean, description: "model/adapter change requested and the engine has not started with it yet"}
        last_seen: {type: string, format: date-time}
        agent_version: {type: string}
        engine_url: {type: string}
        parallel_slots: {type: integer, minimum: 0}
    Stats:
      type: object
      required: [at, workers_total, workers_online, counts, vram_pool, router]
      properties:
        at: {type: integer, description: unix milliseconds}
        workers_total: {type: integer, minimum: 0}
        workers_online: {type: integer, minimum: 0}
        workers_running: {type: integer, minimum: 0}
        workers_reclaiming: {type: integer, minimum: 0}
        workers_yielded: {type: integer, minimum: 0}
        workers_paused: {type: integer, minimum: 0}
        workers_offline: {type: integer, minimum: 0}
        counts: {type: object, additionalProperties: {type: integer}}
        vram_pool: {type: object, required: [total_bytes, used_bytes, free_bytes], properties: {total_bytes: {type: integer}, used_bytes: {type: integer}, free_bytes: {type: integer}}}
        reclaim_p95_ms: {type: number}
        reclaim_max_ms: {type: number}
        router:
          type: object
          required: [inflight, queued, requests_total, served_total, rejected]
          properties:
            inflight: {type: integer}
            queued: {type: integer}
            requests_total: {type: integer}
            served_total: {type: integer}
            failovers_total: {type: integer}
            rejected: {type: object, additionalProperties: {type: integer}}
    CatalogModel:
      type: object
      required: [id, name, quantization, gguf_file, layers, n_kv, head_dim, weights_bytes, confidence, license]
      properties:
        id: {type: string}
        name: {type: string}
        family: {type: string}
        quantization: {type: string}
        gguf_file: {type: string}
        layers: {type: integer, minimum: 1}
        layers_attn: {type: integer}
        n_kv: {type: integer, minimum: 1}
        head_dim: {type: integer, minimum: 1}
        bytes_per_kv: {type: integer}
        weights_bytes: {type: integer, minimum: 1}
        confidence: {type: string, enum: [ESTIMATED, CALIBRATED, MEASURED]}
        license: {type: string}
    Estimate:
      type: object
      required: [model, ctx_per_slot, parallel, required_per_gpu_bytes, allocatable_per_gpu_bytes, fit_status, execution_mode, layer_splits, confidence]
      properties:
        model: {$ref: "#/components/schemas/CatalogModel"}
        ctx_per_slot: {type: integer}
        parallel: {type: integer}
        kv_total_bytes: {type: integer}
        calibrated_vram_bytes: {type: integer}
        required_per_gpu_bytes: {type: integer, minimum: 0}
        allocatable_per_gpu_bytes: {type: integer, minimum: 0}
        buckets_bytes: {$ref: "#/components/schemas/Buckets"}
        fit_status: {type: string}
        execution_mode: {type: string}
        max_gpu_layers: {type: integer}
        fits_entirely: {type: boolean}
        layer_splits:
          type: array
          items: {type: object, required: [gpu_index, start_layer, end_layer, layer_count], properties: {gpu_index: {type: integer}, start_layer: {type: integer}, end_layer: {type: integer}, layer_count: {type: integer}, vram_bytes: {type: integer}}}
        confidence: {type: string}
    Tenant:
      type: object
      required: [id, name, weight, max_inflight, disabled]
      properties: {id: {type: string}, name: {type: string}, weight: {type: number}, max_inflight: {type: integer}, disabled: {type: boolean}}
    TenantCreated:
      type: object
      required: [tenant, api_key]
      properties: {tenant: {$ref: "#/components/schemas/Tenant"}, api_key: {type: string}, note: {type: string}}
    WorkflowSummary:
      type: object
      required: [workflow, created_at, steps, counts, state]
      properties: {workflow: {type: string}, created_at: {type: string}, steps: {type: integer}, counts: {type: object, additionalProperties: {type: integer}}, state: {type: string, enum: [done, running, idle, failed]}}
    FleetFrame:
      type: object
      required: [at, total, counts, cells]
      properties: {at: {type: integer}, total: {type: integer}, counts: {type: object, additionalProperties: {type: integer}}, cells: {type: array, items: {type: array}}}
    StudioError:
      type: object
      required: [error]
      properties: {error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}}
    StudioMethods:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          items:
            type: object
            required: [id, title, summary, status]
            properties: {id: {type: string}, title: {type: string}, summary: {type: string}, status: {type: string, enum: [available, unsupported]}, reason: {type: string}, when_to_use: {type: string}, limits: {type: array, items: {type: string}}}
    StudioHealth:
      type: object
      required: [ok, knowledge_base, llm, trainer, runner]
      properties: {ok: {type: boolean}, knowledge_base: {type: boolean}, llm: {type: boolean}, trainer: {type: boolean}, runner: {type: object}}
    RagAnswer:
      type: object
      required: [query, answer, sources, cited, warnings]
      properties: {query: {type: string}, answer: {type: string}, sources: {type: array, items: {type: object}}, cited: {type: array, items: {type: integer}}, warnings: {type: array, items: {type: string}}}
    StudioJob:
      type: object
      required: [id, tenant, kind, status, params, created_by, created_at]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{32}$"}
        tenant: {type: string}
        kind: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        params: {type: object}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        result: {description: object once the job succeeded, otherwise null}
        error: {description: reason when failed or cancelled, otherwise null}
    ClusterTopology:
      type: object
      required: [mode, rpc_worker_ids, model, status, updated_at, groups, busy_worker_ids, workers]
      description: Top-level mode/primary/rpc fields are the legacy single-group view (first merged group, else smart_1gpu, else split); groups is authoritative.
      properties:
        groups: {type: array, items: {$ref: "#/components/schemas/TopologyGroup"}}
        busy_worker_ids: {type: array, items: {type: string}, description: workers a running switch is touching}
        mode: {type: string, enum: [split, smart_1gpu, merged]}
        primary_worker_id: {type: string}
        rpc_worker_ids: {type: array, items: {type: string}}
        model: {type: string}
        n_cpu_moe: {type: integer}
        kv_type: {type: string, enum: [f16, q8_0]}
        tensor_split: {type: string}
        rpc_port: {type: integer}
        status: {type: string, enum: [ready, switching, error]}
        last_error: {type: string}
        updated_at: {type: string, format: date-time}
        workers: {type: object, additionalProperties: {$ref: "#/components/schemas/TopologyWorker"}}
    TopologyGroup:
      type: object
      required: [id, primary_worker_id, rpc_worker_ids, model, vram_total_bytes]
      properties:
        id: {type: string, description: same as primary_worker_id}
        primary_worker_id: {type: string}
        rpc_worker_ids: {type: array, items: {type: string}}
        model: {type: string}
        kv_type: {type: string}
        tensor_split: {type: string}
        rpc_port: {type: integer}
        vram_total_bytes: {type: integer}
    TopologyWorker:
      type: object
      required: [worker_id, role, mode, online, state]
      properties:
        worker_id: {type: string}
        group_id: {type: string, description: merged group the worker belongs to, if any}
        role: {type: string}
        mode: {type: string}
        model: {type: string}
        online: {type: boolean}
        state: {type: string}
        gpu_name: {type: string}
        vram_total_bytes: {type: integer}
        vram_free_bytes: {type: integer}
        engine_url: {type: string}
        badge: {type: string}
    TopologySwitchRequest:
      type: object
      required: [mode, model, primary_worker_id]
      description: "smart_1gpu needs n_cpu_moe > 0 (no default is guessed); merged needs at least one rpc_worker_ids entry and tensor_split with 1 + len(rpc_worker_ids) numbers (default: equal weights). 400 = invalid request, 409 = another switch is running, 500 = a step failed or timed out (the previous configuration was restored best-effort)."
      properties:
        mode: {type: string, enum: [split, smart_1gpu, merged]}
        primary_worker_id: {type: string}
        rpc_worker_ids: {type: array, items: {type: string}}
        model: {type: string}
        n_cpu_moe: {type: integer}
        kv_type: {type: string, enum: [f16, q8_0]}
        tensor_split: {type: string}
        rpc_port: {type: integer}
