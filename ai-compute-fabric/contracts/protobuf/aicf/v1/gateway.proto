syntax = "proto3";
package aicf.v1;
option go_package = "github.com/aicf/ai-compute-fabric/contracts/gen/go;aicfv1";

import "aicf/v1/fabric.proto";

// FleetGateway is what a worker-guard talks to (plan P2.2). Pause/resume is a
// directive returned on the heartbeat so a worker behind NAT never needs an
// inbound port.
service FleetGateway {
  rpc Register(RegisterRequest) returns (RegisterReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

message RegisterRequest {
  string worker_id = 1;
  string site_id = 2;
  string hostname = 3;
  string gpu_name = 4;
  uint64 vram_total_bytes = 5;
  repeated string supported_engines = 6;
  string agent_version = 7;
  string engine_url = 8;      // where the gateway sends inference requests, e.g. http://10.0.0.5:18090
  uint32 parallel_slots = 9;  // concurrent requests the engine serves (llama-server -np)
}

message RegisterReply {
  uint32 heartbeat_interval_ms = 1;
}

message ReclaimStat {
  uint64 at_unix_ms = 1;
  double detect_to_freed_ms = 2;
}

message HeartbeatRequest {
  WorkerCapacity capacity = 1;
  string state = 2;          // stopped | running | reclaiming | yielded | paused
  string model = 3;
  ReclaimStat last_reclaim = 4;
  uint32 gpu_temp_c = 5;
}

message HeartbeatReply {
  bool registered = 1;       // false => worker must Register again (gateway restarted)
  bool pause_requested = 2;  // operator wants AI paused on this worker
}

// LeaseService reserves VRAM on one worker for a bounded time (plan P2.2). A lease is the
// scheduler's promise and the worker's right to run one job; it ends by Release, by TTL
// expiry, or because the worker went away (revoked). Requests carry an idempotency key so a
// retried RequestLease never reserves twice.
service LeaseService {
  rpc RequestLease(RequestLeaseRequest) returns (RequestLeaseReply);
  rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseReply);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseReply);
}

message RequestLeaseRequest {
  string idempotency_key = 1;   // required
  WorkloadJob job = 2;
  uint64 vram_required_bytes = 3;
  uint64 ttl_ms = 4;            // capped by the gateway
  string model = 5;             // optional: only workers serving this model
}

message RequestLeaseReply {
  bool granted = 1;
  LeaseToken lease = 2;
  string reason = 3;            // when not granted: no_capacity | invalid | ...
}

message ExtendLeaseRequest {
  string lease_id = 1;
  uint64 ttl_ms = 2;
}

message ExtendLeaseReply {
  bool ok = 1;
  LeaseToken lease = 2;
  string reason = 3;            // expired | revoked | unknown | ttl_cap
}

message ReleaseLeaseRequest {
  string lease_id = 1;
}

message ReleaseLeaseReply {
  bool released = 1;            // false = already gone (release is idempotent)
}
