<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICF AI Studio — Tùy biến model</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
<style>
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 6px 0 20px;
  padding: 5px;
  background: var(--bg-elevated);
  border: 1px solid var(--bd);
  border-radius: var(--radius-pill);
}
.tabs button {
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: transparent;
  color: var(--mut);
  font-weight: 500;
  box-shadow: none;
  transition: all .15s ease;
}
.tabs button:hover { color: var(--fg); background: var(--card); }
.tabs button[aria-selected="true"] {
  background: var(--card);
  border-color: rgba(138, 180, 248, 0.35);
  color: var(--acc);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}
.tabs button .tag {
  font-size: 10px;
  margin-left: 6px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--warn-soft);
  color: var(--warn);
}
.stack > * + * { margin-top: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 500; color: var(--fg-secondary); }
.field input, .field select, .field textarea { font-size: 13px; width: 100%; }
.src {
  border-left: 3px solid var(--acc);
  padding: 10px 14px;
  margin: 8px 0;
  background: var(--bg-elevated);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13px;
}
.src.cited { border-left-color: var(--ok); background: var(--ok-soft); }
.src .q { color: var(--fg); font-weight: 600; margin: 2px 0; }
.shot { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: start; }
@media (max-width: 640px) {
  .shot { grid-template-columns: 1fr; }
}
.bar { height: 8px; background: var(--bg-elevated); border: 1px solid var(--bd); border-radius: var(--radius-pill); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gemini-gradient); transition: width .25s ease; }
.answer {
  white-space: pre-wrap;
  padding: 14px 16px;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  line-height: 1.6;
}
.limits { margin: 8px 0 0 18px; padding: 0; color: var(--mut); font-size: 12.5px; }
#loss {
  width: 100%;
  height: 120px;
  display: block;
  background: var(--bg-elevated);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 6px;
}
pre.log {
  max-height: 240px;
  overflow-y: auto;
  overflow-x: hidden;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 11.5px;
  background: var(--bg-elevated);
  border: 1px solid var(--bd);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  line-height: 1.5;
}
</style>
</head>
<body>
<script src="common.js"></script>
<main>
  <div class="page-header">
    <div>
      <h1>AI Studio — Tùy biến model theo dữ liệu của bạn</h1>
    </div>
    <div class="row" style="gap:10px">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px">Tenant <input id="tenant" value="demo" maxlength="64" style="width:160px" class="mono"></label>
      <span id="health" class="pill">…</span>
    </div>
  </div>
  <div id="ro" class="readonly-banner" hidden>Bạn chỉ có quyền xem. Cần vai trò operator để tải lên, huấn luyện hoặc lưu prompt; admin để xóa.</div>
  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="panel"></div>
  <div id="msg" class="mut" role="status" aria-live="polite" style="margin-top:10px;font-size:13px"></div>
</main>
<script src="studio.js"></script>
</body>
</html>
