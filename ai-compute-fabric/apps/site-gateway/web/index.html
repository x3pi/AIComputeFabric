<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICF Fleet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{height:54px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:#fff;padding-bottom:3px;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:13px;margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<script src="common.js"></script>
<main>
<h1>AICF Fleet</h1>
<div class="sub" id="sum">Đang chờ worker…</div>
<div class="card"><div class="grid" id="grid" role="list"></div>
<div class="leg"><span><i style="background:var(--run)"></i>running</span><span><i style="background:var(--rec)"></i>reclaiming</span><span><i style="background:var(--yld)"></i>yielded</span><span><i style="background:var(--stp)"></i>stopped / paused</span><span><i style="background:var(--off)"></i>offline</span></div></div>
<div class="card table-wrap">
<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
<label for="flt">Lọc trạng thái</label><select id="flt"><option value="">tất cả</option><option>running</option><option>reclaiming</option><option>yielded</option><option>paused</option><option>stopped</option><option>offline</option></select>
<button id="prev">Trước</button><span id="pg" class="num"></span><button id="next">Sau</button></div>
<table><thead><tr><th>Worker</th><th>Trạng thái</th><th>Model</th><th class="num">VRAM trống</th><th class="num">Nhiệt độ</th><th class="num">Thu hồi gần nhất</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
const MIB=1048576, PAGE=50, NAMES=["offline","registered","stopped","paused","yielded","reclaiming","running"];
const COL=["--off","--stp","--stp","--stp","--yld","--rec","--run"];
let offset=0,total=0;
function td(t,c){const d=document.createElement("td");d.textContent=t;if(c)d.className=c;return d}
// Heatmap: ONE compact frame per second shared by all viewers; rows are [id,stateCode,vramUsedPermille,tempC].
function renderGrid(s){
  const run=s.counts.running||0,on=s.total-(s.counts.offline||0);
  document.getElementById("sum").textContent=`${on}/${s.total} worker trực tuyến · ${run} đang chạy AI`;
  const g=document.getElementById("grid"),f=document.createDocumentFragment();
  for(const [id,st,used,t] of s.cells){const c=document.createElement("div");c.className="cell";c.role="listitem";
    c.style.background=`var(${COL[st]})`;c.textContent=id.slice(-5);c.title=`${id}: ${NAMES[st]} · VRAM dùng ${used/10}% · ${t} °C`;f.append(c)}
  g.replaceChildren(f);
}
async function loadPage(){
  const st=document.getElementById("flt").value;
  const r=await api(`/api/workers?offset=${offset}&limit=${PAGE}&state=${encodeURIComponent(st)}`);
  if(!r.ok)return;
  total=+r.headers.get("X-Total-Count")||0;const ws=await r.json();
  document.getElementById("pg").textContent=`${total?offset+1:0}–${offset+ws.length} / ${total}`;
  const b=document.getElementById("rows");b.replaceChildren();
  for(const w of ws){const tr=document.createElement("tr");
    const btn=document.createElement("button");const paused=w.pause_requested;btn.textContent=paused?"Cho chạy lại":"Tạm dừng AI";
    btn.onclick=async()=>{await api(`/api/workers/${encodeURIComponent(w.worker_id)}/${paused?"resume":"pause"}`,{method:"POST"});loadPage()};
    const act=document.createElement("td");act.append(btn);
    tr.append(td(w.worker_id),td(w.state),td(w.model||"-"),td(w.online?Math.round(w.vram_free_bytes/MIB)+" MiB":"-","num"),td(w.online?w.gpu_temp_c+" °C":"-","num"),td(w.last_reclaim_ms?Math.round(w.last_reclaim_ms)+" ms":"-","num"),act);b.append(tr)}
}
document.getElementById("prev").onclick=()=>{offset=Math.max(0,offset-PAGE);loadPage()};
document.getElementById("next").onclick=()=>{if(offset+PAGE<total){offset+=PAGE;loadPage()}};
document.getElementById("flt").onchange=()=>{offset=0;loadPage()};
stream("/api/fleet/stream", renderGrid);
loadPage();setInterval(loadPage,2000);
</script>
</body>
</html>
