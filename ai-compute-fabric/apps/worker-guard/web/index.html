<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICF Worker Guard</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--card:#fff;--mut:#667085;--bd:#e3e6eb;
--os:#8d99ae;--w:#3b6fd4;--kv:#2a9d8f;--c:#e9a23b;--h:#b8bec9;--free:#d7efe0}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--fg:#e6e9ef;--card:#181d27;--mut:#98a2b3;--bd:#2a3140;
--os:#6b768a;--w:#5b8def;--kv:#3fb8a9;--c:#f0b254;--h:#4a5262;--free:#1f3a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.badge{padding:2px 10px;border-radius:99px;font-weight:600;border:1px solid var(--bd)}
.running{background:#d7efe0;color:#14532d}.reclaiming{background:#fde2c8;color:#7a3d00}
.yielded{background:#e0e7ff;color:#1e3a8a}.stopped,.paused{background:#eceef2;color:#344054}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--free);margin:12px 0}
.bar div{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:13px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--w);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>AICF Worker Guard</h1>
<div class="sub">Một GPU. Số liệu đọc trực tiếp từ nvidia-smi và log llama.cpp, không có dữ liệu giả.</div>
<div class="card">
  <div class="row">
    <div><span id="state" class="badge stopped">…</span> <span id="gpu" class="num"></span></div>
    <div><button id="pause">Tạm dừng AI</button> <button id="resume">Cho phép chạy lại</button></div>
  </div>
  <div class="bar" id="bar" role="img" aria-label="Phân bổ VRAM theo 6 nhóm"></div>
  <div class="leg" id="leg"></div>
</div>
<div class="card">
  <strong>Nhật ký thu hồi GPU</strong>
  <table><thead><tr><th>Giờ</th><th>Sự kiện</th><th>Chi tiết</th><th class="num">Thu hồi (ms)</th></tr></thead>
  <tbody id="ev"><tr><td colspan="4">Chưa có sự kiện</td></tr></tbody></table>
</div>
</main>
<script>
const MIB=1048576;
const GROUPS=[["OSUser","OS & người dùng","--os"],["Weights","Trọng số","--w"],["KVState","KV / state","--kv"],
 ["Compute","Compute","--c"],["Headroom","Headroom","--h"],["Allocatable","Còn cấp phát được","--free"]];
function cell(t,cls){const d=document.createElement("td");d.textContent=t;if(cls)d.className=cls;return d}
function render(s){
  const st=document.getElementById("state");st.textContent=s.state;st.className="badge "+s.state;
  const g=s.gpu;document.getElementById("gpu").textContent=
    ` ${g.UsedMiB} / ${g.TotalMiB} MiB · ${g.TempC} °C · engine ${s.engine_mib} MiB`;
  const b=s.buckets_bytes,bar=document.getElementById("bar"),leg=document.getElementById("leg");
  bar.replaceChildren();leg.replaceChildren();
  for(const [k,label,v] of GROUPS){
    const bytes=b[k]||0;
    const d=document.createElement("div");d.style.width=(100*bytes/b.Total)+"%";d.style.background=`var(${v})`;d.title=label;bar.append(d);
    const l=document.createElement("span");const i=document.createElement("i");i.style.background=`var(${v})`;
    l.append(i,`${label}: ${Math.round(bytes/MIB)} MiB`);leg.append(l);
  }
  const tb=document.getElementById("ev");tb.replaceChildren();
  const evs=(s.events||[]).slice().reverse().slice(0,30);
  if(!evs.length){const tr=document.createElement("tr");const td=cell("Chưa có sự kiện");td.colSpan=4;tr.append(td);tb.append(tr)}
  for(const e of evs){const tr=document.createElement("tr");
    tr.append(cell(new Date(e.at).toLocaleTimeString()),cell(e.kind),cell(e.detail),cell(e.detect_to_freed_ms?e.detect_to_freed_ms.toFixed(0):"","num"));tb.append(tr)}
}
const es=new EventSource("/api/events");es.onmessage=m=>render(JSON.parse(m.data));
for(const id of ["pause","resume"])document.getElementById(id).onclick=()=>fetch("/api/"+id,{method:"POST"});
</script>
</body>
</html>
