[project]
name = "ai-compute-fabric"
version = "1.0.0"
description = "Enterprise AI Compute Fabric — 200-PC Workstation GPU Pool, 6-Bucket VRAM Estimator, Agent Orchestrator & AI Studio"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "numpy==2.5.4",
    "httpx==0.28.1",
    "requests==2.34.2",
    "nats-py==2.16.0",
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "cryptography==50.0.2",
    "protobuf==7.36.2",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "pillow==13.0.0",
    "reportlab==5.1.0",
    "jiwer==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pip-audit==2.10.1",
    "cyclonedx-bom==7.5.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["hardware: needs real PCs / GPUs (P0+ gates), skipped on dev machines"]

[tool.ruff]
line-length = 160
extend-exclude = ["third_party", ".venv", "node_modules", "contracts/gen"]

[tool.ruff.lint]
# Real defects only (syntax errors, undefined names, unused imports/variables, bad comparisons); style rules are not enforced.
select = ["E9", "F", "B006", "B008", "B023", "B904"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
files = ["agents", "audio", "training", "core", "studio"]
