[project]
name = "ai-compute-fabric"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["hardware: needs real PCs / GPUs (P0+ gates), skipped on dev machines"]

[tool.ruff]
line-length = 160
extend-exclude = ["third_party", ".venv", "node_modules"]

[tool.ruff.lint]
# Real defects only (syntax errors, undefined names, unused imports/variables, bad comparisons); style rules are not enforced.
select = ["E9", "F", "B006", "B008", "B023", "B904"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
files = ["agents", "audio", "training", "core"]
