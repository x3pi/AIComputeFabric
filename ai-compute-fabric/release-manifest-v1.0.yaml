# Release Manifest — AI Compute Fabric v1.1 (Production Ready + Serverless GPU + CM6 Web IDE)
schema_version: 1
release:
  version: "1.1.0"
  date: "2026-11-05"
  status: "production-ready"
  upstream_manifest: "third_party/upstream-manifest.yaml"
  openapi_contract: "contracts/openapi/aicf_v1.yaml"
  protobuf_contracts:
    - "contracts/protobuf/aicf/v1/fabric.proto"
    - "contracts/protobuf/aicf/v1/gateway.proto"
  notice_file: "NOTICE"
  sre_runbook: "docs/SRE_RUNBOOK.md"
  production_guide: "docs/PRODUCTION.md"
  security_assessment: "docs/SECURITY_ASSESSMENT_2026-11.md"

binaries:
  - name: "site-gateway"
    module: "apps/site-gateway"
    entrypoint: "."
    targets: ["linux/amd64", "windows/amd64"]
  - name: "aicf-admin"
    module: "apps/site-gateway"
    entrypoint: "./cmd/aicf-admin"
    targets: ["linux/amd64", "windows/amd64"]
  - name: "worker-guard"
    module: "apps/worker-guard"
    entrypoint: "."
    targets: ["linux/amd64", "windows/amd64"]
  - name: "gcp-server"
    module: "apps/global-control-plane"
    entrypoint: "./cmd/gcp-server"
    targets: ["linux/amd64", "windows/amd64"]

python_services:
  - name: "vram-sidecar"
    module: "core.vram_sidecar"
  - name: "agent-orchestrator-dag-api"
    module: "agents.dag_api"
  - name: "ai-studio"
    module: "studio"
  - name: "serverless-gpu"
    module: "serverless.app"
  - name: "bestofn-service"
    module: "bestofn.service"

security_and_sbom:
  public_key: "deploy/security/cosign.pub"
  verify_script: "deploy/security/verify_sboms.sh"
  scan_script: "deploy/security/scan.sh"
  sboms:
    - "benchmarks/reports/security/sbom_go_site-gateway.cdx.json"
    - "benchmarks/reports/security/sbom_go_worker-guard.cdx.json"
    - "benchmarks/reports/security/sbom_go_vram-estimator.cdx.json"
    - "benchmarks/reports/security/sbom_go_global-control-plane.cdx.json"
    - "benchmarks/reports/security/sbom_python_env.cdx.json"

verified_evidence_rtx3060_linux:
  - gate: "G-VRAM (Q4_K_M / Q8_0 / F16 & 32B Hybrid)"
    reports:
      - "benchmarks/reports/p1_vram_calibration_rtx3060.json"
      - "benchmarks/reports/p1_vram_calibration_q8_f16_rtx3060.json"
      - "benchmarks/reports/p1_vram_hybrid_32b_rtx3060.json"
      - "benchmarks/reports/p1_sidecar_estimate_vs_measured.json"
  - gate: "G-RECLAIM (< 2s GPU Reclaim under CUDA pressure)"
    reports:
      - "benchmarks/reports/p2_gpu_reclaim_poc_rtx3060_v2.json"
  - gate: "P2 Control Plane, Leases, RBAC, Audit & Browser E2E"
    reports:
      - "benchmarks/reports/p2_gateway_capacity.json"
      - "benchmarks/reports/p2_dashboard_e2e.json"
      - "benchmarks/reports/p2_roles_e2e.json"
  - gate: "P3 Inference Adapters (llama.cpp + vLLM), Prefix Affinity, MoE & Speculative"
    reports:
      - "benchmarks/reports/p2_session_affinity_rtx3060.json"
      - "benchmarks/reports/p2_tenant_fairness_rtx3060.json"
      - "benchmarks/reports/p4_B06_moe_hybrid_rtx3060.json"
      - "benchmarks/reports/p4_B07_speculative_rtx3060.json"
      - "benchmarks/reports/p3_vllm_adapter_contract.json"
  - gate: "P4 Agent Orchestrator, NATS JetStream, pgvector RAG, Document/OCR & DAG E2E"
    reports:
      - "benchmarks/reports/p5_orchestrator_scale_simulated.json"
      - "benchmarks/reports/p5_agent_dag_e2e.json"
  - gate: "P5/P6 QLoRA Training, Studio E2E & Vietnamese Audio Pipeline"
    reports:
      - "benchmarks/reports/p9_studio_evidence.json"
      - "benchmarks/reports/p6_tts_asr_roundtrip.json"
  - gate: "Pha A-E Serverless GPU, CodeMirror 6 Web IDE & Full Security Remediation"
    reports:
      - "docs/reports/PHA_A_BASELINE.md"
      - "docs/reports/PHA_B.md"
      - "docs/reports/PHA_C.md"
      - "docs/reports/SECURITY_REMEDIATION.md"
      - "docs/reports/PHA_E_RELEASE.md"
      - "benchmarks/reports/p_editor_c6_e2e.json"
      - "benchmarks/reports/p_serverless_6_e2e.json"

pending_physical_and_organisational_signoff:
  - item: "Legal & HR Sign-off (third_party/upstream-manifest.yaml legal_reviewed=true)"
    status: "pending_human_review"
  - item: "Windows 10/11 Physical Workstation Fleet (WDDM 2.x/3.x, PDH 3D Engine counters, Windows Service SCM)"
    status: "pending_windows_hardware"
  - item: "Multi-PC LAN RoCEv2/TCP Distributed Model Split & Multi-Site WAN Physical Link"
    status: "pending_multi_host_hardware"
