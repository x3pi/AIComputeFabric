<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICF CAD Agent</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--mute:#667085;--line:#e1e5ec;--accent:#2563eb;--accent-ink:#fff;--user:#e8f0fe;--ok:#15803d;--bad:#b42318;--warn:#b45309;--code:#f1f3f7;--shadow:0 1px 2px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1319;--panel:#171c24;--ink:#e6eaf2;--mute:#97a1b3;--line:#262d38;--accent:#4f8cff;--accent-ink:#06101f;--user:#1c2a44;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--code:#10151c;--shadow:none}}
:root[data-theme=dark]{--bg:#0f1319;--panel:#171c24;--ink:#e6eaf2;--mute:#97a1b3;--line:#262d38;--accent:#4f8cff;--accent-ink:#06101f;--user:#1c2a44;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--code:#10151c;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:650}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);padding:3px 10px;border:1px solid var(--line);border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
label.tg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer}
main{flex:1;overflow-y:auto;padding:18px 16px 8px}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:12px;max-width:100%;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{background:var(--user);align-self:flex-end;white-space:pre-wrap;max-width:85%}
.msg.bot{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.msg.bot p{margin:0 0 .6em}.msg.bot p:last-child{margin:0}
.msg.bot pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow:auto;font:13px/1.45 ui-monospace,Consolas,monospace;margin:.5em 0}
.msg.bot code{background:var(--code);padding:1px 5px;border-radius:5px;font:13px ui-monospace,Consolas,monospace}
.msg.bot pre code{background:none;padding:0}
.msg.bot ul{margin:.3em 0 .6em 1.2em;padding:0}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:pulse .9s infinite}
details.think{margin-bottom:8px;color:var(--mute);font-size:13px}
details.think pre{white-space:pre-wrap;background:none;padding:6px 0 0;margin:0;font:13px/1.5 inherit}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;overflow:hidden}
.tool>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center}
.tool>summary::-webkit-details-marker{display:none}
.tool .st{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.tool.ok .st{background:var(--ok)}.tool.err .st{background:var(--bad)}.tool.run .st{animation:pulse 1s infinite}
.tool .nm{font:600 13px ui-monospace,Consolas,monospace}
.tool .ar{color:var(--mute);font:12.5px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .body{padding:0 12px 10px;border-top:1px solid var(--line)}
.tool pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Consolas,monospace;max-height:260px;overflow:auto;background:var(--code);padding:8px 10px;border-radius:8px}
.tool img,.msg img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.ask{border:1.5px solid var(--warn);border-radius:12px;background:var(--panel);padding:12px 14px}
.ask b{color:var(--warn)}
.ask pre{margin:8px 0;white-space:pre-wrap;font:12.5px ui-monospace,Consolas,monospace;background:var(--code);padding:8px 10px;border-radius:8px}
.ask .row{display:flex;gap:8px}
.note{color:var(--mute);font-size:13px;text-align:center}
.note.err{color:var(--bad)}
.empty{text-align:center;color:var(--mute);margin:8vh auto 0;max-width:560px}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.ex{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ex button{text-align:left;color:var(--ink)}
footer{padding:10px 16px 14px;background:var(--bg)}
.box{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:180px;padding:6px 8px}
.hint{max-width:860px;margin:6px auto 0;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AICF CAD Agent</h1>
  <span class="chip"><span id="dot" class="dot"></span><span id="status">Đang kết nối…</span></span>
  <span class="chip" id="model"></span>
  <span class="sp"></span>
  <label class="tg" title="Hiện phần model suy nghĩ (chậm hơn, có thể chính xác hơn)"><input type="checkbox" id="think"> Suy nghĩ</label>
  <button id="stop" class="danger" disabled>Dừng</button>
  <button id="reset">Cuộc trò chuyện mới</button>
</header>
<main id="main"><div class="col" id="col"></div></main>
<footer>
  <div class="box">
    <textarea id="inp" rows="1" placeholder="Nhập yêu cầu thiết kế… (Enter để gửi, Shift+Enter xuống dòng)" autofocus></textarea>
    <button id="send" class="primary">Gửi</button>
  </div>
  <div class="hint">Dữ liệu thiết kế ở lại trên máy này. Các thao tác xóa / lưu / xuất file cần bạn bấm Cho phép.</div>
</footer>
<script>
"use strict";
const $=id=>document.getElementById(id);
const col=$("col"), main=$("main");
let last=0, busy=false, cur=null, curThink=null, tools=[], asks={}, pollErr=0;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function api(path,body){
  return fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-Requested-With":"aicf"},body:JSON.stringify(body)})
    .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,j})));
}
function scrollDown(force){
  const near=main.scrollHeight-main.scrollTop-main.clientHeight<160;
  if(force||near) main.scrollTop=main.scrollHeight;
}

/* very small, safe markdown: fenced code, inline code, **bold**, "- " lists, paragraphs. Everything goes in through textContent. */
function inline(parent,s){
  const re=/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g;let i=0,m;
  while((m=re.exec(s))){
    if(m.index>i)parent.appendChild(document.createTextNode(s.slice(i,m.index)));
    const t=m[0];
    if(t[0]==="`")parent.appendChild(el("code",null,t.slice(1,-1)));else parent.appendChild(el("b",null,t.slice(2,-2)));
    i=m.index+t.length;
  }
  if(i<s.length)parent.appendChild(document.createTextNode(s.slice(i)));
}
function render(node,text){
  node.textContent="";
  const lines=text.split("\n");let i=0,p=null,ul=null;
  const flush=()=>{p=null;ul=null};
  while(i<lines.length){
    const l=lines[i];
    if(l.startsWith("```")){
      flush();const buf=[];i++;
      while(i<lines.length&&!lines[i].startsWith("```")){buf.push(lines[i]);i++}
      i++;const pre=el("pre"),code=el("code",null,buf.join("\n"));pre.appendChild(code);node.appendChild(pre);continue;
    }
    if(/^\s*[-*] /.test(l)){
      if(!ul){p=null;ul=el("ul");node.appendChild(ul)}
      const li=el("li");inline(li,l.replace(/^\s*[-*] /,""));ul.appendChild(li);i++;continue;
    }
    if(l.trim()===""){flush();i++;continue}
    ul=null;
    if(!p){p=el("p");node.appendChild(p)}else p.appendChild(document.createElement("br"));
    inline(p,l);i++;
  }
}

function emptyState(){
  col.textContent="";
  const d=el("div","empty");
  d.appendChild(el("h2",null,"Xin chào, bạn muốn thiết kế gì?"));
  d.appendChild(el("div",null,"Agent điều khiển SolidWorks đang mở trên máy này, từng bước một, rồi kiểm tra lại kích thước và thể tích."));
  const ex=el("div","ex");
  ["Tạo một khối hộp 40x20x10 mm rồi kiểm tra kích thước và thể tích.",
   "Làm tấm thép phẳng 100x60 dày 5 mm, bo tròn 4 góc R8, có 4 lỗ Ø6 cách mép 10 mm.",
   "Hiện tại trong SolidWorks đang mở những tài liệu nào?"].forEach(t=>{
    const b=el("button",null,t);b.onclick=()=>{$("inp").value=t;send()};ex.appendChild(b)});
  d.appendChild(ex);col.appendChild(d);
}
function clearEmpty(){const e=col.querySelector(".empty");if(e)e.remove()}

function botBubble(){
  clearEmpty();
  const b=el("div","msg bot");const th=el("details","think");th.hidden=true;th.appendChild(el("summary",null,"Model đang suy nghĩ"));th.appendChild(el("pre"));
  b.appendChild(th);const body=el("div");b.appendChild(body);col.appendChild(b);
  cur={wrap:b,body,text:"",think:th,thinkText:""};body.classList.add("cursor");return cur;
}
function toolCard(name,args){
  clearEmpty();cur=null;
  const d=el("details","tool run");const s=el("summary");
  s.appendChild(el("span","st"));s.appendChild(el("span","nm",name));
  const short=JSON.stringify(args);s.appendChild(el("span","ar",short.length>120?short.slice(0,120)+"…":short));d.appendChild(s);
  const body=el("div","body");body.appendChild(el("pre",null,"Tham số:\n"+JSON.stringify(args,null,2)));d.appendChild(body);
  col.appendChild(d);tools.push({d,body});return tools[tools.length-1];
}
function addNote(t,err){clearEmpty();col.appendChild(el("div","note"+(err?" err":""),t))}

let raf=0;
function paint(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(cur){render(cur.body,cur.text);cur.body.classList.add("cursor")}scrollDown()})}

function handle(ev){
  switch(ev.kind){
    case "user":{clearEmpty();cur=null;col.appendChild(el("div","msg user",ev.text));scrollDown(true);break}
    case "think":{if(!cur)botBubble();cur.thinkText+=ev.text;cur.think.hidden=false;cur.think.querySelector("pre").textContent=cur.thinkText;paint();break}
    case "text":{if(!cur)botBubble();cur.text+=ev.text;paint();break}
    case "text_end":{if(cur){cur.body.classList.remove("cursor");if(!cur.text.trim()&&!cur.thinkText)cur.wrap.remove();else render(cur.body,ev.full||cur.text)}cur=null;break}
    case "tool_call":{toolCard(ev.name,ev.args);scrollDown();break}
    case "tool_result":{
      const t=tools.pop();if(!t)break;
      const bad=/^ERROR/.test(ev.result)||/"ok"\s*:\s*false/.test(ev.result);
      t.d.classList.remove("run");t.d.classList.add(bad?"err":"ok");
      t.body.appendChild(el("pre",null,"Kết quả:\n"+ev.result));
      (ev.images||[]).forEach(u=>{const i=el("img");i.src=u;i.alt="Ảnh chụp từ SolidWorks";t.body.appendChild(i)});
      if((ev.images||[]).length)t.d.open=true;
      scrollDown();break}
    case "confirm":{
      clearEmpty();cur=null;
      const a=el("div","ask");a.appendChild(el("b",null,"Cần bạn cho phép: "));a.appendChild(document.createTextNode(ev.name));
      a.appendChild(el("pre",null,JSON.stringify(ev.args,null,2)));
      const row=el("div","row");const ok=el("button","primary","Cho phép"),no=el("button",null,"Từ chối");
      const answer=v=>{ok.disabled=no.disabled=true;api("/api/confirm",{cid:ev.cid,allow:v})};
      ok.onclick=()=>answer(true);no.onclick=()=>answer(false);row.append(ok,no);a.appendChild(row);
      col.appendChild(a);asks[ev.cid]={a,ok,no};scrollDown(true);break}
    case "confirm_done":{const k=asks[ev.cid];if(k){k.ok.disabled=k.no.disabled=true;k.a.appendChild(el("div","note",ev.allow?"Đã cho phép.":"Đã từ chối."));delete asks[ev.cid]}break}
    case "info":{addNote(ev.text.trim());break}
    case "step_limit":{
      clearEmpty();cur=null;
      const n=el("div","ask");n.appendChild(el("b",null,"Đã dùng hết "+ev.steps+" bước cho một yêu cầu. "));
      n.appendChild(document.createTextNode("Agent chưa kịp báo kết quả cuối. Việc đã làm trong SolidWorks vẫn còn nguyên."));
      const row=el("div","row");const go=el("button","primary","Tiếp tục");
      go.onclick=()=>{go.disabled=true;$("inp").value="Tiếp tục hoàn thành yêu cầu trước: kiểm tra lại kết quả, mở view cho tôi xem và tóm tắt ngắn.";send()};
      row.appendChild(go);n.appendChild(row);col.appendChild(n);scrollDown(true);break}
    case "error":{if(cur){cur.body.classList.remove("cursor");cur=null}addNote("Lỗi: "+ev.text,true);break}
    case "reset":{col.textContent="";cur=null;tools=[];asks={};emptyState();break}
    case "done":{if(cur){cur.body.classList.remove("cursor");cur=null}break}
  }
}
function setBusy(b){
  busy=b;$("dot").className="dot"+(b?" busy":"");$("status").textContent=b?"Đang làm việc…":"Sẵn sàng";
  $("stop").disabled=!b;$("send").disabled=b;
}
async function poll(){
  try{
    const r=await api("/api/events?since="+last);
    if(!r.ok){pollErr++;if(r.status===401){$("status").textContent="Hết phiên: mở lại bằng cửa sổ khởi động"}}
    else{
      pollErr=0;
      for(const ev of r.j.events){handle(ev);last=ev.id}
      setBusy(r.j.busy);
    }
  }catch(e){pollErr++;$("status").textContent="Mất kết nối tới agent";$("dot").className="dot busy"}
  setTimeout(poll,pollErr?1500:350);
}
async function send(){
  const t=$("inp").value.trim();if(!t||busy)return;
  const r=await api("/api/send",{text:t});
  if(r.ok){$("inp").value="";grow();setBusy(true)}else addNote(r.j.error||"Không gửi được",true);
}
function grow(){const t=$("inp");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,180)+"px"}
$("send").onclick=send;
$("inp").addEventListener("input",grow);
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("stop").onclick=()=>api("/api/stop",{});
$("reset").onclick=async()=>{const r=await api("/api/reset",{});if(!r.ok)addNote(r.j.error,true)};
$("think").onchange=e=>api("/api/think",{on:e.target.checked});
(async()=>{
  const r=await api("/api/state");
  if(r.ok){$("model").textContent=r.j.model+" · "+r.j.tools+" công cụ";$("think").checked=r.j.think}
  if(!r.ok||r.j.last===0)emptyState();
  poll();
})();
</script>
</body>
</html>
