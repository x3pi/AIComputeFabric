[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadfabric"
version = "0.7.4"
description = "Backend-agnostic CAD agent: a local LLM writes CadQuery, the kernel measures every step, formulas from a planner verify the result"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cadquery>=2.4"]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]

[project.scripts]
cadfabric = "cadfabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cadfabric = ["web_page.html", "static/*.js", "static/vendor/*", "static/licenses/*"]

[project.gui-scripts]
cadfabric-app = "cadfabric.cli:app_main"
