#!/usr/sbin/nft -f
# AICF Production Firewall Rules (nftables) — Pha B2
# Enforces network segmentation for:
#   - 8099/tcp (worker-guard control server): ONLY loopback + Site Gateway IP
#   - 50052/tcp (ggml-rpc tensor split): ONLY private direct link 10.42.0.0/24 (unencrypted RPC)
#   - 18090, 18095, 18100, 18110/tcp (internal Python sidecars): ONLY loopback

table inet aicf_filter {
  set gateway_ips {
    type ipv4_addr
    elements = { 127.0.0.1, 10.42.0.1 }
  }

  set rpc_subnet {
    type ipv4_addr
    flags interval
    elements = { 127.0.0.0/8, 10.42.0.0/24 }
  }

  chain input {
    type filter hook input priority 0; policy accept;

    # Always allow loopback and established traffic
    iif "lo" accept
    ct state established,related accept

    # Protect worker-guard control endpoint (8099/tcp)
    tcp dport 8099 ip saddr @gateway_ips accept
    tcp dport 8099 counter drop

    # Protect ggml-rpc tensor-split port (50052/tcp — unencrypted protocol, private link only)
    tcp dport 50052 ip saddr @rpc_subnet accept
    tcp dport 50052 counter drop

    # Protect internal sidecars (serverless 18110, studio 18090, bestofn 18095, agents 18100)
    tcp dport { 18090, 18095, 18100, 18110 } counter drop
  }
}
