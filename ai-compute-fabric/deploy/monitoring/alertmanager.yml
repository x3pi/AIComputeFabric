global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h
  receiver: "aicf-ops-webhook"
  routes:
    - matchers:
        - severity="critical"
      receiver: "aicf-ops-critical"
      group_wait: 5s

receivers:
  - name: "aicf-ops-webhook"
    webhook_configs:
      - url: "http://127.0.0.1:9099/alerts/webhook"
        send_resolved: true
  - name: "aicf-ops-critical"
    webhook_configs:
      - url: "http://127.0.0.1:9099/alerts/critical"
        send_resolved: true
